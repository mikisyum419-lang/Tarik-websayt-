<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የታሪክ ድረ-ገጽ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; color: #333; }
        header { background-color: #8B0000; color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 2.5rem; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #8B0000; border-bottom: 2px solid #8B0000; padding-bottom: 8px; }
        p { line-height: 1.8; font-size: 1.1rem; text-align: justify; }
        footer { text-align: center; padding: 20px; background-color: #333; color: white; position: relative; bottom: 0; width: 100%; margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>የታሪክ ማኅደር</h1>
    </header>

    <div class="container">
        <h2>እንኳን ወደ ታሪክ ድረ-ገጽዎ በሰላም መጡ!</h2>
        <p>ይህ ስለ ታሪክ የሚተርክ አዲሱ ድረ-ገጽዎ ነው። እዚህ ቦታ ላይ የተለያዩ ታሪካዊ ክስተቶችን፣ የነገሥታትን የሕይወት ታሪክ፣ ጥንታዊ ቅርሶችን እና ሌሎች ትረካዎችን በዝርዝር ማቅረብ ይችላሉ።</p>
        <p>ይህንን ጽሑፍ በመቀየር መጻፍ የፈለጉትን እውነተኛ የታሪክ መረጃ ማስገባት ይችላሉ።</p>
    </div>

    <footer>
        <p>© 2026 የታሪክ ድረ-ገጽ - መብቱ በሕግ የተጠበቀ ነው</p>
    </footer>

</body>
</html>
